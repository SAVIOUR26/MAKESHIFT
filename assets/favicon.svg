<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0D1F3C"/>
  <!-- Truck body -->
  <rect x="8"  y="28" width="32" height="18" rx="3" fill="#2D6A9F"/>
  <!-- Cab -->
  <path d="M40 34 L40 46 L56 46 L56 40 L50 32 L42 32 Z" fill="#4A90D9"/>
  <!-- Cab window -->
  <path d="M43 33 L48 33 L54 39 L43 39 Z" fill="#B8DEFF" opacity=".8"/>
  <!-- Orange stripe -->
  <rect x="8" y="30" width="32" height="3" rx="1.5" fill="#F47920"/>
  <!-- Wheels -->
  <circle cx="18" cy="47" r="6" fill="#0D1F3C" stroke="#4A5568" stroke-width="1.5"/>
  <circle cx="18" cy="47" r="2.5" fill="#F47920"/>
  <circle cx="47" cy="47" r="6" fill="#0D1F3C" stroke="#4A5568" stroke-width="1.5"/>
  <circle cx="47" cy="47" r="2.5" fill="#F47920"/>
  <!-- Speed lines -->
  <line x1="4" y1="36" x2="8" y2="36" stroke="#F47920" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <line x1="2" y1="40" x2="8" y2="40" stroke="#F47920" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
  <line x1="5" y1="44" x2="8" y2="44" stroke="#F47920" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
  <!-- ML text on cab -->
  <text x="47" y="45" font-family="Arial Black" font-size="7" font-weight="900" fill="white" text-anchor="middle" opacity=".9">ML</text>
</svg>
